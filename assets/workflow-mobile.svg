</defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace}.muted{fill:#94a3b8}.white{fill:#f8fafc}</style>
<rect width="768" height="1400" rx="28" fill="#06070a"/>
<rect x="1" y="1" width="766" height="1398" rx="27" fill="url(#grid)" stroke="#334155" stroke-opacity=".55"/>
<ellipse cx="440" cy="670" rx="340" ry="640" fill="url(#haze)"/><text x="48" y="58" font-size="15" letter-spacing="2" fill="#8ec9ff">REFERENCE IMAGE → VIDEO</text><text x="48" y="107" font-size="32" font-weight="600" fill="#f8fafc">From your image to a finished clip.</text><rect x="48" y="154" width="672" height="184" rx="20" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".26"/><text x="76" y="196" class="mono" font-size="18" fill="#5aa6ff">01</text><text x="133" y="198" font-size="31" font-weight="600" fill="#f1f5f9">Load Image</text><text x="76" y="245" class="mono" font-size="22" fill="#94a3b8">Your local reference</text><text x="76" y="297" font-size="22" fill="#cbd5e1">Local IMAGE</text><path d="M384 339V376" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="378" width="672" height="184" rx="20" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".26"/><text x="76" y="420" class="mono" font-size="18" fill="#5aa6ff">02</text><text x="133" y="422" font-size="31" font-weight="600" fill="#f1f5f9">Image: Edit</text><text x="76" y="469" class="mono" font-size="22" fill="#94a3b8">gemini-3.1-flash-image</text><text x="76" y="521" font-size="22" fill="#cbd5e1">Paid action 1</text><path d="M384 563V600" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="602" width="672" height="184" rx="20" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".26"/><text x="76" y="644" class="mono" font-size="18" fill="#5aa6ff">03</text><text x="133" y="646" font-size="31" font-weight="600" fill="#f1f5f9">Image: Result</text><text x="76" y="693" class="mono" font-size="22" fill="#94a3b8">Preview + public result URLs</text><text x="76" y="745" font-size="22" fill="#cbd5e1">Read existing task</text><path d="M384 787V824" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="826" width="672" height="184" rx="20" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".26"/><text x="76" y="868" class="mono" font-size="18" fill="#5aa6ff">04</text><text x="133" y="870" font-size="31" font-weight="600" fill="#f1f5f9">Video: Submit</text><text x="76" y="917" class="mono" font-size="22" fill="#94a3b8">grok-imagine-video-1.5-preview</text><text x="76" y="969" font-size="22" fill="#cbd5e1">Paid action 2</text><path d="M384 1011V1048" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="1050" width="672" height="184" rx="20" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".26"/><text x="76" y="1092" class="mono" font-size="18" fill="#5aa6ff">05</text><text x="133" y="1094" font-size="31" font-weight="600" fill="#f1f5f9">Video: Result</text><text x="76" y="1141" class="mono" font-size="22" fill="#94a3b8">Preview + video file + URL</text><text x="76" y="1193" font-size="22" fill="#cbd5e1">Read existing task</text><text x="48" y="1316" font-size="22" fill="#cbd5e1">Two explicit paid actions.</text><text x="48" y="1351" font-size="22" fill="#94a3b8">Keep each task ID to recover its result.</text>
