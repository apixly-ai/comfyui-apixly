<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="508" viewBox="0 0 1440 508" role="img" aria-labelledby="title description">
<title id="title">Reference image to video workflow</title><desc id="description">Load Image to Gemini reference edit to Image Result URLs to explicit Grok image-to-video to Video Result. Two paid actions with task ID recovery. A schematic, not a product screenshot.</desc>
<defs>
 <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00AEEF"/><stop offset=".52" stop-color="#1670f0"/><stop offset="1" stop-color="#635bff"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9edff" stop-opacity=".10"/><stop offset=".55" stop-color="#2e8fff" stop-opacity=".055"/><stop offset="1" stop-color="#0c0d12" stop-opacity=".8"/></linearGradient>
 <radialGradient id="haze"><stop stop-color="#1670f0" stop-opacity=".23"/><stop offset="1" stop-color="#1670f0" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/></pattern>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".35"/></filter>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5aa6ff" stroke-width="1.5"/></marker>
</defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace}.muted{fill:#94a3b8}.white{fill:#f8fafc}</style>
<rect width="1440" height="508" rx="28" fill="#06070a"/>
<rect x="1" y="1" width="1438" height="506" rx="27" fill="url(#grid)" stroke="#334155" stroke-opacity=".55"/>
<ellipse cx="750" cy="290" rx="650" ry="290" fill="url(#haze)"/><text x="54" y="61" font-size="12" letter-spacing="2.5" fill="#8ec9ff">REFERENCE IMAGE → VIDEO</text><text x="54" y="112" font-size="34" font-weight="600" fill="#f8fafc">A visible path from your image to a finished clip.</text><g filter="url(#shadow)"><rect x="54" y="168" width="244" height="202" rx="18" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".24"/></g>
<text x="76" y="202" class="mono" font-size="12" fill="#5aa6ff">01</text><text x="76" y="244" font-size="22" font-weight="600" fill="#f1f5f9">Load Image</text><text x="76" y="274" class="mono" font-size="15" fill="#94a3b8">Your local reference</text><path d="M76 323H276" stroke="#334155"/><text x="76" y="349" font-size="13" fill="#cbd5e1">Local IMAGE</text><path d="M299 269H324" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="326" y="168" width="244" height="202" rx="18" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".24"/></g>
<text x="348" y="202" class="mono" font-size="12" fill="#5aa6ff">02</text><text x="348" y="244" font-size="22" font-weight="600" fill="#f1f5f9">Image: Edit</text><text x="348" y="274" class="mono" font-size="15" fill="#94a3b8">gemini-3.1-flash-image</text><path d="M348 323H548" stroke="#334155"/><text x="348" y="349" font-size="13" fill="#cbd5e1">Paid action 1</text><path d="M571 269H596" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="598" y="168" width="244" height="202" rx="18" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".24"/></g>
<text x="620" y="202" class="mono" font-size="12" fill="#5aa6ff">03</text><text x="620" y="244" font-size="22" font-weight="600" fill="#f1f5f9">Image: Result</text><text x="620" y="274" class="mono" font-size="11" fill="#94a3b8">Preview + public result URLs</text><path d="M620 323H820" stroke="#334155"/><text x="620" y="349" font-size="13" fill="#cbd5e1">Read existing task</text><path d="M843 269H868" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="870" y="168" width="244" height="202" rx="18" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".24"/></g>
<text x="892" y="202" class="mono" font-size="12" fill="#5aa6ff">04</text><text x="892" y="244" font-size="22" font-weight="600" fill="#f1f5f9">Video: Submit</text><text x="892" y="274" class="mono" font-size="11" fill="#94a3b8">grok-imagine-video-1.5-preview</text><path d="M892 323H1092" stroke="#334155"/><text x="892" y="349" font-size="13" fill="#cbd5e1">Paid action 2</text><path d="M1115 269H1140" stroke="#2e8fff" stroke-width="2" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1142" y="168" width="244" height="202" rx="18" fill="url(#glass)" stroke="#5aa6ff" stroke-opacity=".24"/></g>
<text x="1164" y="202" class="mono" font-size="12" fill="#5aa6ff">05</text><text x="1164" y="244" font-size="22" font-weight="600" fill="#f1f5f9">Video: Result</text><text x="1164" y="274" class="mono" font-size="15" fill="#94a3b8">Preview + video file + URL</text><path d="M1164 323H1364" stroke="#334155"/><text x="1164" y="349" font-size="13" fill="#cbd5e1">Read existing task</text><text x="54" y="434" font-size="17" fill="#cbd5e1">Two explicit paid actions. Keep each task ID to recover its results.</text><text x="54" y="465" font-size="15" fill="#94a3b8">Reference video uses source framing: model_default resolution + aspect ratio. The output reports its actual dimensions.</text>
</svg>