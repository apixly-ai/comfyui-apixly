[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-apixly"
version = "0.3.1"
description = "Apixly AI API for ComfyUI: image generation, reference image edits, video generation, free creative controls and task recovery."
keywords = ["apixly", "comfyui", "ai-api", "image-generation", "image-editing", "video-generation", "creative-tools"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Apixly", email = "support@apixly.ai" }]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://apixly.ai"
Console = "https://platform.apixly.ai"
Repository = "https://github.com/apixly-ai/comfyui-apixly"
Documentation = "https://apixly.ai/docs"
"ComfyUI Guide" = "https://github.com/apixly-ai/comfyui-apixly#readme"
"Models and Pricing" = "https://platform.apixly.ai/models"
"API Keys" = "https://platform.apixly.ai/keys"
Issues = "https://github.com/apixly-ai/comfyui-apixly/issues"

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.24"]

[tool.setuptools]
packages = ["apixly_media"]

[tool.comfy]
Banner = "https://raw.githubusercontent.com/apixly-ai/comfyui-apixly/apixly/assets/social-preview.png"
PublisherId = "apixly"
DisplayName = "Apixly AI API: Images & Video"
Icon = "https://raw.githubusercontent.com/apixly-ai/comfyui-apixly/HEAD/assets/icon.png"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
# Vendored canonical source must remain byte-identical across all three plugins.
exclude = ["apixly_media/creative_compiler.py", "apixly_media/catalog.py"]
